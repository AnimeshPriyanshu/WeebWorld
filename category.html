<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category - WeebWorld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 dark:from-[#0b0c10] dark:via-[#1f2833] dark:to-[#0b0c10] text-center font-sans m-0 transition-all duration-500 min-h-screen text-gray-800 dark:text-white">

<!-- Floating Particles Background -->
<div id="particles" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

<!-- Navbar -->
<nav id="navbar" class="sticky top-0 z-50 flex justify-between items-center px-8 py-2.5 bg-gradient-to-r from-indigo-600/95 to-violet-600/95 dark:from-[#0f0f23]/95 dark:to-violet-950/95 backdrop-blur-md text-white shadow-xl max-md:flex-col max-md:px-4 max-md:py-3.5 max-md:gap-2.5">
    <img src="images/logo.webp" alt="WeebWorld" class="h-10 w-10 rounded-full block object-cover bg-white dark:bg-gray-800 p-1 border-2 border-white/30 dark:border-violet-400/50 shadow-md cursor-pointer hover:scale-110 transition-transform duration-300" onclick="window.location.href='index.html'">
    <div class="flex flex-wrap justify-center gap-2 max-md:w-full max-md:mt-1">
        <button class="bg-gradient-to-r from-emerald-400 to-teal-400 text-white px-4 py-2 rounded-full font-bold border-none cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-emerald-400/30 text-sm" onclick="window.location.href='index.html'">🏠 Home</button>
        <button id="dark-btn" class="bg-white/20 backdrop-blur-sm text-white px-3.5 py-2 rounded-full font-semibold border border-white/20 cursor-pointer transition-all duration-300 hover:bg-white/30 text-lg leading-none">🌙</button>
        <button id="watchlist-btn" class="bg-gradient-to-r from-pink-500 to-rose-400 text-white px-4 py-2 rounded-full font-semibold border-none cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-pink-500/30 text-sm" onclick="window.location.href='index.html'">❤️ Watchlist</button>
    </div>
</nav>

<!-- Category Content -->
<div class="relative z-10 py-10 px-4 max-md:py-6">
    <h1 id="page-title" class="text-4xl max-md:text-2xl font-extrabold mb-8">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-violet-400 dark:to-purple-300">Loading...</span>
    </h1>

    <div id="results" class="w-[90%] max-w-[1200px] mx-auto mt-4 grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-6 max-md:grid-cols-2 max-md:w-[95%] max-md:gap-4"></div>
    <div id="pagination" class="my-8 mx-auto flex justify-center items-center gap-4"></div>
</div>

<!-- Back to Top Button -->
<button id="back-top" class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white text-xl shadow-xl cursor-pointer border-none flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 hover:shadow-violet-500/40 hover:scale-110">↑</button>

<!-- Modal (Copied exactly from index.html for consistency) -->
<div id="pop-box" class="hidden-section fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-[9999] overflow-y-auto py-4">
    <div class="modal-content bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-7 rounded-2xl max-w-[800px] w-[92%] max-h-[90vh] overflow-y-auto relative text-left shadow-2xl border border-white/20 dark:border-gray-700/50 max-md:p-5 max-md:w-[95%]">
        <span id="close-pop" class="absolute top-3 right-4 text-3xl cursor-pointer text-gray-400 hover:text-gray-700 dark:text-gray-500 dark:hover:text-gray-200 transition-colors duration-200 z-10">&times;</span>

        <div class="flex gap-8 items-start max-md:flex-col max-md:items-center max-md:gap-4">
            <div class="flex-shrink-0">
                <img id="pop-img" class="w-[220px] max-md:w-[160px] h-auto rounded-xl block shadow-xl" src="" alt="poster">
                <button id="pop-watchlist-btn" class="w-[220px] max-md:w-[160px] mt-3 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-rose-400 text-white font-semibold text-sm border-none cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-pink-500/30 flex items-center justify-center gap-2">
                    <span id="pop-heart">🤍</span> Add to Watchlist
                </button>
            </div>
            <div class="pop-details flex-1 text-gray-700 dark:text-gray-200 max-md:text-center">
                <h2 id="pop-title" class="text-2xl max-md:text-xl font-bold text-indigo-600 dark:text-violet-400 mb-3"></h2>
                <div class="grid grid-cols-2 max-md:grid-cols-1 gap-x-6 gap-y-1.5">
                    <p id="pop-score" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-type" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-episodes" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-status" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-aired" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-premiered" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-duration" class="text-sm text-gray-600 dark:text-gray-300"></p>
                    <p id="pop-rating" class="text-sm text-gray-600 dark:text-gray-300"></p>
                </div>
                <p id="pop-producers" class="text-sm mt-2 text-gray-600 dark:text-gray-300"></p>
                <p id="pop-studios" class="text-sm mb-1 text-gray-600 dark:text-gray-300"></p>
                <p id="pop-genres" class="text-sm mb-1 text-gray-600 dark:text-gray-300"></p>
                <p id="pop-themes" class="text-sm mb-1 text-gray-600 dark:text-gray-300"></p>
            </div>
        </div>

        <div class="mt-5 border-t border-gray-200 dark:border-gray-700 pt-4">
            <h3 class="text-sm font-bold text-indigo-600 dark:text-violet-400 mb-2">📖 Synopsis</h3>
            <p id="pop-text" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400"></p>
        </div>

        <div id="trailer-section" class="hidden-section mt-5 border-t border-gray-200 dark:border-gray-700 pt-4">
            <h3 class="text-sm font-bold text-indigo-600 dark:text-violet-400 mb-3">🎬 Trailer</h3>
            <div class="rounded-xl overflow-hidden shadow-lg aspect-video">
                <iframe id="pop-trailer" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <div id="streaming-section" class="hidden-section mt-5 border-t border-gray-200 dark:border-gray-700 pt-4">
            <h3 class="text-sm font-bold text-indigo-600 dark:text-violet-400 mb-3">📺 Where to Watch</h3>
            <div id="streaming-links" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="mt-5 border-t border-gray-200 dark:border-gray-700 pt-4">
            <h3 class="text-sm font-bold text-indigo-600 dark:text-violet-400 mb-3">💬 Comments <span id="comment-count" class="text-gray-400 font-normal">(0)</span></h3>
            <div class="flex gap-2 mb-4">
                <input type="text" id="comment-input" placeholder="Share your thoughts..." class="flex-1 px-4 py-2.5 rounded-full border border-gray-200 dark:border-gray-700 bg-white/90 dark:bg-gray-700/90 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-violet-400 text-sm transition-all duration-300">
                <button id="comment-submit" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold text-sm border-none cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-violet-500/30 flex-shrink-0">Post</button>
            </div>
            <div id="comments-list" class="space-y-3 max-h-[300px] overflow-y-auto pr-1"></div>
        </div>
    </div>
</div>

<script src="js/category.js"></script>
</body>
</html>
